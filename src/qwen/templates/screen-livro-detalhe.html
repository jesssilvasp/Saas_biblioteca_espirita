<div class="screen qwen-screen" id="screen-livro-detalhe">
            <div class="px-5 pt-6 pb-4 flex items-center gap-3 screen-header">
                <button class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center" data-action="go:screen-acervo" aria-label="Voltar">
                    <i class="fas fa-arrow-left text-gray-600" aria-hidden="true"></i>
                </button>
                <h1 class="text-lg font-bold text-gray-800 flex-1">Detalhes do Livro</h1>
                <button class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center" data-action="edit-book" aria-label="ellipsis-v text-gray-600">
                    <i class="fas fa-ellipsis-v text-gray-600" aria-hidden="true"></i>
                </button>
            </div>
            <div class="flex-1 scroll-container px-5 pb-8 space-y-4 screen-body">
                <!-- Book Header -->
                <div class="bg-gradient-to-br from-spirit-50 to-spirit-100 rounded-2xl p-5 flex gap-4">
                    <div class="w-24 h-32 bg-white rounded-xl flex items-center justify-center shadow-sm flex-shrink-0">
                        <i class="fas fa-book text-spirit-300 text-3xl" aria-hidden="true"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-base font-bold text-gray-800 leading-tight" data-bind="book-title"></h3>
                        <p class="text-sm text-gray-600 mt-1" data-bind="book-author"></p>
                        <p class="text-xs text-gray-500 mt-0.5" data-bind="book-publisher"></p>
                        <div class="flex items-center gap-2 mt-3">
                            <span class="text-[10px] bg-spirit-200 text-spirit-800 px-2 py-0.5 rounded-full font-medium" data-bind="book-cde"></span>
                            <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-medium" data-bind="book-category"></span>
                        </div>
                    </div>
                </div>

                <!-- Location -->
                <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm">
                    <div class="flex items-center gap-2 mb-3">
                        <i class="fas fa-map-marker-alt text-spirit-500" aria-hidden="true"></i>
                        <h4 class="text-sm font-bold text-gray-800">Localização Física</h4>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div class="bg-gray-50 rounded-xl p-2.5 text-center">
                            <p class="text-lg font-bold text-spirit-700" data-bind="book-location"></p>
                            <p class="text-[10px] text-gray-500">Estante</p>
                        </div>
                        <div class="bg-gray-50 rounded-xl p-2.5 text-center">
                            <p class="text-lg font-bold text-spirit-700" data-bind="book-shelf"></p>
                            <p class="text-[10px] text-gray-500">Prateleira</p>
                        </div>
                        <div class="bg-gray-50 rounded-xl p-2.5 text-center">
                            <p class="text-lg font-bold text-spirit-700" data-bind="book-cde"></p>
                            <p class="text-[10px] text-gray-500">Classificação</p>
                        </div>
                    </div>
                </div>

                <!-- Copies -->
                <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-copy text-spirit-500" aria-hidden="true"></i>
                            <h4 class="text-sm font-bold text-gray-800">Exemplares (Tombos)</h4>
                        </div>
                        <span class="text-xs text-gray-500" data-bind="copy-count"></span>
                    </div>
                    <div class="space-y-2" data-slot="copies"></div>
                </div>

                <!-- Actions -->
                <div class="grid grid-cols-2 gap-3">
                    <button class="bg-spirit-600 text-white py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2" data-action="lend-book">
                        <i class="fas fa-arrow-up" aria-hidden="true"></i>
                        Emprestar
                    </button>
                    <button class="bg-gray-100 text-gray-700 py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2" data-action="book-history">
                        <i class="fas fa-history" aria-hidden="true"></i>
                        Histórico
                    </button>
                </div>
            </div>
        </div>
