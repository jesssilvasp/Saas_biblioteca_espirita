<div class="screen qwen-screen" id="screen-scan-result">
            <div class="px-5 pt-6 pb-4 flex items-center gap-3 screen-header">
                <button class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center" data-action="go:screen-scanner" aria-label="Voltar">
                    <i class="fas fa-arrow-left text-gray-600" aria-hidden="true"></i>
                </button>
                <h1 class="text-lg font-bold text-gray-800">Revisar Dados do Livro</h1>
            </div>
            <div class="flex-1 scroll-container px-5 pb-8 space-y-4 screen-body">
                <!-- ISBN Badge -->
                <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 flex items-center gap-3">
                    <div class="w-8 h-8 bg-emerald-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-check-circle text-emerald-600" aria-hidden="true"></i>
                    </div>
                    <div>
                        <p class="text-xs text-emerald-800 font-medium">ISBN detectado</p>
                        <p class="text-sm text-emerald-700 font-bold" data-bind="isbn"></p>
                    </div>
                </div>

                <!-- Book Preview -->
                <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm">
                    <div class="flex gap-4">
                        <div class="w-20 h-28 bg-gradient-to-br from-spirit-100 to-spirit-200 rounded-xl flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-book text-spirit-400 text-2xl" aria-hidden="true"></i>
                        </div>
                        <div class="flex-1 space-y-1.5">
                            <div>
                                <label class="text-[10px] text-gray-400 uppercase tracking-wide" for="screen-scan-result-field-18">Título</label>
                                <input type="text" class="w-full text-sm font-semibold text-gray-800 border-b border-gray-200 pb-1 focus:outline-none focus:border-spirit-400" style="" data-field="title" id="screen-scan-result-field-18">
                            </div>
                            <div>
                                <label class="text-[10px] text-gray-400 uppercase tracking-wide" for="screen-scan-result-field-21">Autor</label>
                                <input type="text" class="w-full text-sm text-gray-700 border-b border-gray-200 pb-1 focus:outline-none focus:border-spirit-400" style="" data-field="author" id="screen-scan-result-field-21">
                            </div>
                            <div>
                                <label class="text-[10px] text-gray-400 uppercase tracking-wide" for="screen-scan-result-field-24">Editora</label>
                                <input type="text" class="w-full text-sm text-gray-700 border-b border-gray-200 pb-1 focus:outline-none focus:border-spirit-400" style="" data-field="publisher" id="screen-scan-result-field-24">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Additional Fields -->
                <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] text-gray-400 uppercase tracking-wide" for="screen-scan-result-field-29">Edição</label>
                            <input type="text" class="w-full text-sm text-gray-700 border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:border-spirit-400" style="" data-field="edition" id="screen-scan-result-field-29">
                        </div>
                        <div>
                            <label class="text-[10px] text-gray-400 uppercase tracking-wide" for="screen-scan-result-field-32">Ano</label>
                            <input type="text" class="w-full text-sm text-gray-700 border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:border-spirit-400" style="" data-field="year" id="screen-scan-result-field-32">
                        </div>
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-400 uppercase tracking-wide" for="screen-scan-result-field-35">Subtítulo</label>
                        <input type="text" placeholder="Opcional" class="w-full text-sm text-gray-700 border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:border-spirit-400" style="" data-field="subtitle" id="screen-scan-result-field-35">
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-400 uppercase tracking-wide" for="screen-scan-result-field-38">Descrição</label>
                        <textarea class="w-full text-sm text-gray-700 border border-gray-200 rounded-lg px-3 py-2 h-20 resize-none focus:outline-none focus:border-spirit-400" placeholder="Sinopse da obra..." style="" data-field="notes" id="screen-scan-result-field-38"></textarea>
                    </div>
                </div>

                <!-- Source Badge -->
                <div class="bg-blue-50 border border-blue-100 rounded-xl p-3 flex items-center gap-2">
                    <i class="fas fa-info-circle text-blue-500 text-sm" aria-hidden="true"></i>
                    <p class="text-xs text-blue-700">Consulta bibliográfica por ISBN. <span class="font-medium">Revise os dados antes de salvar.</span></p>
                </div>

                <!-- Actions -->
                <div class="space-y-2.5 pt-2">
                    <button class="w-full bg-spirit-600 text-white py-3.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-2" data-action="save-scanned-book">
                        <i class="fas fa-check" aria-hidden="true"></i>
                        Confirmar e Salvar
                    </button>
                    <button class="w-full bg-gray-100 text-gray-700 py-3.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-2" data-action="edit-scanned-book">
                        <i class="fas fa-edit" aria-hidden="true"></i>
                        Editar manualmente
                    </button>
                    <button class="w-full text-gray-400 py-2 text-sm" data-action="go:screen-scanner">
                        Cancelar e escanear outro
                    </button>
                </div>
            </div>
        </div>
